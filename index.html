<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pinyin</title>
<style>
  :root {
    --key-bg: rgba(255, 255, 255, 0.10);
    --key-bg-hover: rgba(255, 255, 255, 0.28);
    --key-border: rgba(255, 255, 255, 0.22);
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text);
  }
  body {
    display: flex; flex-direction: column;
    padding: 2.5vw;
    gap: 2vw;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
  }
  /* Windows / Linux : pas de flou natif → fond sombre translucide */
  body.no-vibrancy {
    background: linear-gradient(160deg, rgba(60,60,70,0.82), rgba(25,25,30,0.82));
  }
  header {
    -webkit-app-region: drag;   /* on déplace la fenêtre par la barre du haut */
    display: flex; align-items: center; gap: 1.5vw;
    height: 10vw; min-height: 18px;
    padding: 0 1vw;
  }
  header .title { flex: 1; font-size: 4.2vw; color: var(--muted); letter-spacing: .05em; }
  header button {
    -webkit-app-region: no-drag;
    width: 8vw; height: 8vw; min-width: 16px; min-height: 16px;
    border-radius: 50%;
    border: 1px solid var(--key-border);
    background: var(--key-bg);
    color: var(--text);
    font-size: 4.4vw; line-height: 1;
    cursor: pointer;
  }
  header button:hover { background: var(--key-bg-hover); }
  header button.on { background: rgba(255,255,255,0.45); color: #000; }
  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 1.6vw;
  }
  .key {
    display: flex; align-items: center; justify-content: center;
    border-radius: 2.6vw;
    border: 1px solid var(--key-border);
    background: var(--key-bg);
    backdrop-filter: blur(8px);
    font-size: 8vw;
    cursor: pointer;
    transition: background .12s, transform .08s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .key:hover { background: var(--key-bg-hover); }
  .key:active { transform: scale(0.93); }
</style>
</head>
<body>
  <header>
    <span class="title">拼音</span>
    <button id="caps" title="Majuscules">⇧</button>
    <button id="smaller" title="Plus petit">−</button>
    <button id="bigger" title="Plus grand">+</button>
    <button id="close" title="Quitter">×</button>
  </header>
  <div id="grid"></div>

<script>
  const ROWS = [
    ['ā', 'á', 'ǎ', 'à'],
    ['ē', 'é', 'ě', 'è'],
    ['ī', 'í', 'ǐ', 'ì'],
    ['ō', 'ó', 'ǒ', 'ò'],
    ['ū', 'ú', 'ǔ', 'ù'],
    ['ǖ', 'ǘ', 'ǚ', 'ǜ'],
  ];
  const grid = document.getElementById('grid');
  const capsBtn = document.getElementById('caps');
  let caps = false;

  function render() {
    grid.innerHTML = '';
    for (const row of ROWS) {
      for (const ch of row) {
        const key = document.createElement('div');
        key.className = 'key';
        key.textContent = caps ? ch.toUpperCase() : ch;
        grid.appendChild(key);
      }
    }
  }

  // mousedown + preventDefault : ne jamais prendre le focus clavier
  document.addEventListener('mousedown', (e) => e.preventDefault());

  grid.addEventListener('mousedown', (e) => {
    const key = e.target.closest('.key');
    if (key) window.kb.type(key.textContent);
  });

  capsBtn.addEventListener('mousedown', () => {
    caps = !caps;
    capsBtn.classList.toggle('on', caps);
    render();
  });
  document.getElementById('smaller').addEventListener('mousedown', () => window.kb.resizeBy(0.9));
  document.getElementById('bigger').addEventListener('mousedown', () => window.kb.resizeBy(1.1));
  document.getElementById('close').addEventListener('mousedown', () => window.kb.quit());

  if (window.kb.platform !== 'darwin') document.body.classList.add('no-vibrancy');
  render();
</script>
</body>
</html>
